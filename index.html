<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Signature — Portfolio</title>
<meta name="description" content="Portfolio of Khairul Islam Juseb under the brand Signature.">

<!-- Tiro Bangla Font & Premium English Fonts -->
<link rel="stylesheet" href="https://fonts.maateen.me/tiro-bangla/font.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

<style>
  :root{
    /* Updated Color Scheme based on #09105c */
    --bg: #09105c;
    --bg-alt: #0e1a78;
    --paper: #ffffff;
    --paper-dim: #cbd5e1; /* Lighter dim for dark bg */
    
    --gold: #facc15; /* Brighter gold for contrast */
    --gold-soft: rgba(250, 204, 21, 0.15);
    
    --whatsapp: #22c55e;
    --whatsapp-soft: rgba(34, 197, 94, 0.15);
    
    --line: rgba(255, 255, 255, 0.18); /* Slightly more visible lines */
    --max: 600px;
    
    /* Super Smooth Easing */
    --ease-out-swift: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out-smooth: cubic-bezier(0.65, 0, 0.35, 1);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--paper);
    font-family: 'Tiro Bangla', sans-serif;
    line-height: 1.7; /* Slightly increased line height for readability */
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a{ color: inherit; text-decoration: none; }
  h1, h2, h3{ font-weight: 700; margin: 0; }

  .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 20px; }

  /* Header & Navigation */
  header{
    position: fixed; top:0; left:0; right:0; z-index: 100;
    backdrop-filter: blur(20px); /* Increased blur */
    background: rgba(9, 16, 92, 0.85); /* Adjusted with new bg */
    border-bottom: 1px solid var(--line);
    transition: background 0.5s var(--ease-out-swift), transform 0.5s var(--ease-out-swift);
  }
  
  /* Initial state for animation */
  body.loaded header {
    animation: fadeInDown 1s var(--ease-out-swift) forwards;
  }

  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height: 70px; /* Slightly taller */ }
  .brand{ font-family:'Caveat', cursive; font-size: 2.5rem; font-weight: 700; color: #ffffff; }
  .brand span{ color: var(--gold); }
  
  .navlinks{ display:flex; gap: 25px; list-style:none; margin:0; padding:0; }
  .navlinks a{
    color: var(--paper-dim); font-size: 0.95rem; letter-spacing: 0.02em;
    text-transform: uppercase; font-weight: 600; transition: color 0.4s var(--ease-out-swift); position: relative;
    font-family: 'Inter', sans-serif;
  }
  .navlinks a::after{
    content: ''; position: absolute; width: 0; height: 2px; bottom: -6px; left: 0;
    background: var(--gold); transition: width 0.4s var(--ease-out-swift);
  }
  .navlinks a:hover{ color: var(--paper); } /* Changed to pure white on hover */
  .navlinks a:hover::after{ width: 100%; }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Scroll Reveal Animation Classes */
  .reveal-up {
    opacity: 0;
    transform: translateY(50px);
    transition: opacity 1.2s var(--ease-out-swift), transform 1.2s var(--ease-out-swift);
  }
  .reveal-up.active {
    opacity: 1;
    transform: translateY(0);
  }

  main{ padding-top: 70px; }
  section{ padding: 80px 0; border-bottom: 1px solid var(--line); }

  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--gold);
    letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 15px; display:block;
  }

  /* Hero Section */
  .hero{ min-height: 90vh; display:flex; flex-direction:column; justify-content:center; text-align: center; }
  
  .profile-container {
    width: 160px; height: 160px; margin: 0 auto 30px auto; border-radius: 50%;
    padding: 5px; background: linear-gradient(135deg, var(--gold), var(--whatsapp));
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); /* Soften shadow */
    position: relative;
    opacity: 0; /* For JS load animation */
  }
  
  /* JS adds 'loaded' class to body to trigger this */
  body.loaded .profile-container {
    animation: profilePop 1.2s var(--ease-out-swift) forwards;
  }

  .profile-img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    background: var(--bg-alt); border: 4px solid var(--bg);
  }

  @keyframes profilePop {
    0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .hero h1{ 
    font-family: 'Playfair Display', serif; 
    font-size: clamp(2.8rem, 8vw, 4rem); 
    line-height: 1.1; 
    margin: 15px 0 20px; 
    color: #ffffff; 
    font-style: italic;
  }
  .hero h1 span{ color: var(--gold); font-style: normal; }
  
  .hero p{ 
    font-family: 'Inter', sans-serif; 
    color: var(--paper-dim); 
    font-size: 1.1rem; 
    margin: 0 auto 35px auto; 
    max-width: 520px; 
  }
  
  .hero-badge {
    display: inline-block; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500;
    color: var(--gold); background: var(--gold-soft); padding: 8px 18px; border-radius: 50px; /* Pill shape */
    border: 1px solid rgba(250, 204, 21, 0.3); margin-bottom: 15px; letter-spacing: 0.05em;
  }

  .contact-btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
  .btn{
    display:inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 30px; background: var(--gold); color: var(--bg); /* Text color matches new bg */
    font-size: 1.05rem; font-weight: 700; border-radius: 50px; font-family: 'Inter', sans-serif;
    transition: transform 0.4s var(--ease-out-swift), background 0.4s ease, box-shadow 0.4s ease;
    position: relative; overflow: hidden; z-index: 1;
  }
  
  /* Shine effect on hover */
  .btn::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: all 0.6s; z-index: -1;
  }
  
  .btn:hover{ background: #eab308; transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .btn:hover::before { left: 100%; }

  .btn-outline {
    background: transparent; border: 2px solid var(--whatsapp); color: var(--whatsapp);
  }
  .btn-outline:hover { background: var(--whatsapp); color: var(--bg); border-color: var(--whatsapp); transform: translateY(-5px) scale(1.02); }

  /* Contact Section */
  .contact-section h2 { font-size: 2.5rem; margin-bottom: 15px; color: #ffffff; }
  .contact-desc { color: var(--paper-dim); font-size: 1.1rem; margin-bottom: 40px; font-family: 'Tiro Bangla', sans-serif; }
  
  .contact-info-list { display: flex; flex-direction: column; gap: 18px; margin-bottom: 40px; }
  .contact-info-item {
    display: flex; align-items: center; gap: 20px; background: var(--bg-alt);
    padding: 20px 25px; border-radius: 15px; border: 1px solid var(--line);
    transition: transform 0.4s var(--ease-out-swift), border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .contact-info-item:hover { transform: translateX(10px); border-color: rgba(250,204,21,0.5); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .contact-icon {
    width: 50px; height: 50px; background: var(--gold-soft); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 1.4rem; flex-shrink: 0;
  }
  .contact-detail span { display: block; font-size: 0.85rem; color: var(--paper-dim); text-transform: uppercase; font-family: 'Inter', sans-serif; margin-bottom: 2px; }
  .contact-detail b { font-size: 1.1rem; color: #ffffff; font-weight: 600; font-family: 'Inter', sans-serif; letter-spacing: 0.01em; }

  /* Form Styles */
  .contact-form {
    display: flex; flex-direction: column; gap: 20px; background: var(--bg-alt);
    padding: 35px; border-radius: 15px; border: 1px solid var(--line);
  }
  .form-group { display: flex; flex-direction: column; gap: 10px; }
  .form-group label { font-size: 0.95rem; color: #ffffff; font-family: 'Inter', sans-serif; font-weight: 500; }
  .form-control {
    width: 100%; padding: 16px 18px; background: var(--bg); border: 2px solid var(--line);
    border-radius: 10px; color: #ffffff; font-family: 'Tiro Bangla', sans-serif; font-size: 1.1rem;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .form-control::placeholder { color: #94a3b8; }
  .form-control:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); }
  textarea.form-control { resize: vertical; min-height: 150px; }

  .submit-btn {
    width: 100%; padding: 18px; background: var(--whatsapp); color: var(--bg); font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer; font-size: 1.1rem; font-family: 'Inter', sans-serif;
    transition: background 0.3s ease, transform 0.4s var(--ease-out-swift), box-shadow 0.4s ease;
    display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px;
  }
  .submit-btn:hover { background: #16a34a; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4); }

  footer { padding: 50px 0; text-align: center; font-size: 0.95rem; color: var(--paper-dim); font-family: 'Inter', sans-serif; border-top: 1px solid var(--line); }
</style>
</head>
<body>

    <ul class="navlinks">
      <li><a href="#hero">Home</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="top">
  
  <!-- HERO SECTION -->
  <section id="hero" class="hero wrap reveal-up">
    <div>
      <div class="profile-container">
